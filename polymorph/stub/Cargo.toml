[package]
name = "stub"
version = "0.1.0"
edition = "2024"


[profile.release]
strip = "symbols"          # Removes debuginfo + symbol table (function/variable names)
panic = "abort"            # Kills the process on panic — no unwinding tables, no stack trace logic
codegen-units = 1          # Single unit — maximum LLVM optimization, harder to reverse
lto = true                 # Link-Time Optimization — cross-crate inlining, smaller & more opaque
opt-level = "z"            # Optimize aggressively for size — eliminates dead code, obfuscates flow
debug-assertions = false   # Removes debug-only checks (default is already false in release, but explicit)
overflow-checks = false    # Removes integer overflow panic paths (default is false in release, explicit)
debug = false              # No debug info at all (strip="symbols" implies this, but explicit is fine)

[dependencies]
busywork = "0.1.0"
dinvoke_rs = "0.2.2"
